<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass — Apple's liquid glass, in pure web tech</title>
  <meta name="description" content="Apple iOS 26 Liquid Glass material rebuilt for the web: real refraction via SVG displacement filters, spring physics, chromatic aberration. Zero dependencies." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ea8ff'/%3E%3Cstop offset='1' stop-color='%23ff7ac3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='6.5' fill='white' opacity='.9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- animated wallpaper + drifting orbs: content for the glass to refract -->
  <canvas id="wallpaper"></canvas>
  <div class="vignette"></div>
  <div class="orbs">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
    <i class="orb o4"></i><i class="orb o5"></i><i class="orb o6"></i>
  </div>

  <div class="ui">
    <!-- top: centered glass nav -->
    <header class="nav" data-liquid-glass data-radius="999" data-blur="3">
      <span class="logo">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="lg-mark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#ff7ac3"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="url(#lg-mark)"/>
          <circle cx="12" cy="12" r="6.2" fill="#fff" opacity=".92"/>
          <circle cx="10.2" cy="9.6" r="1.8" fill="#fff"/>
        </svg>
        Liquid Glass
      </span>
      <nav>
        <a href="https://github.com/Pi-zzy/liquid-glass#how-it-works">How it works</a>
        <a href="https://github.com/Pi-zzy/liquid-glass">GitHub</a>
      </nav>
    </header>

    <!-- hero -->
    <section class="hero">
      <h1>Liquid <span class="grad">Glass</span></h1>
      <p>Apple's iOS&nbsp;26 material, rebuilt with two web primitives —
         SVG displacement filters and a spring. Zero dependencies.</p>
      <div class="cta">
        <a class="btn solid" href="https://github.com/Pi-zzy/liquid-glass#quick-start">Add to your site</a>
        <a class="btn" data-liquid-glass data-radius="999" data-blur="1" href="https://github.com/Pi-zzy/liquid-glass#how-it-works">How it works</a>
      </div>
    </section>

    <!-- middle row: three equal widgets, real information -->
    <section class="widgets">
      <!-- live clock -->
      <div class="widget" data-liquid-glass data-radius="26" data-draggable="true" id="clockWidget">
        <svg class="clock-face" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="face" cx="60" cy="60" r="52"/>
          <g class="ticks">
            <line x1="60" y1="12" x2="60" y2="20"/><line x1="60" y1="100" x2="60" y2="108"/>
            <line x1="12" y1="60" x2="20" y2="60"/><line x1="100" y1="60" x2="108" y2="60"/>
            <g class="minor">
              <line x1="33.5" y1="24.6" x2="37.6" y2="27"/><line x1="24.6" y1="33.5" x2="27" y2="37.6"/>
              <line x1="86.5" y1="24.6" x2="82.4" y2="27"/><line x1="95.4" y1="33.5" x2="93" y2="37.6"/>
              <line x1="33.5" y1="95.4" x2="37.6" y2="93"/><line x1="24.6" y1="86.5" x2="27" y2="82.4"/>
              <line x1="86.5" y1="95.4" x2="82.4" y2="93"/><line x1="95.4" y1="86.5" x2="93" y2="82.4"/>
            </g>
          </g>
          <line class="hand hour" id="handHour" x1="60" y1="60" x2="60" y2="34"/>
          <line class="hand minute" id="handMinute" x1="60" y1="60" x2="60" y2="24"/>
          <line class="hand second" id="handSecond" x1="60" y1="66" x2="60" y2="20"/>
          <circle class="cap" cx="60" cy="60" r="3"/>
        </svg>
        <div class="digital" id="clockDigital">00:00</div>
        <div class="dateline" id="clockDate">—</div>
      </div>

      <!-- real calendar -->
      <div class="widget" data-liquid-glass data-radius="26" data-draggable="true" id="calWidget">
        <div class="cal-head">
          <span class="cal-month" id="calMonth">—</span>
          <span class="cal-year" id="calYear">—</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <!-- designed landscape (pure SVG, no assets) -->
      <div class="widget" data-liquid-glass data-radius="26" data-draggable="true" id="photoWidget">
        <svg class="photo" viewBox="0 0 220 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="ph-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#33418f"/><stop offset=".55" stop-color="#c96a8d"/><stop offset="1" stop-color="#ffc46b"/>
            </linearGradient>
            <linearGradient id="ph-sea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d98a6a"/><stop offset="1" stop-color="#413468"/>
            </linearGradient>
            <radialGradient id="ph-sun" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#fff3d6"/><stop offset=".7" stop-color="#ffd98f"/><stop offset="1" stop-color="#ffd98f" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="220" height="102" fill="url(#ph-sky)"/>
          <circle cx="128" cy="78" r="30" fill="url(#ph-sun)" opacity=".85"/>
          <circle cx="128" cy="78" r="13" fill="#ffe9b8"/>
          <path d="M0 84 L38 52 L74 84 Z" fill="#4a3f78" opacity=".85"/>
          <path d="M52 84 L108 38 L168 84 Z" fill="#3a3168" opacity=".92"/>
          <path d="M138 84 L184 56 L220 84 Z" fill="#453a74" opacity=".8"/>
          <rect y="102" width="220" height="58" fill="url(#ph-sea)"/>
          <g opacity=".55" stroke="#ffe1a6" stroke-width="2" stroke-linecap="round">
            <line x1="112" y1="112" x2="144" y2="112"/>
            <line x1="104" y1="122" x2="152" y2="122"/>
            <line x1="116" y1="132" x2="140" y2="132"/>
          </g>
        </svg>
      </div>
    </section>

    <!-- material lab: the live controls, centered under the widgets -->
    <section class="lab" data-liquid-glass data-radius="24" id="panel">
      <h2>Material Lab <button class="reset" id="resetBtn">reset layout</button></h2>
      <div class="lab-grid">
        <div class="ctl"><label>Refraction <output id="oRefraction">34px</output></label>
          <input type="range" id="rRefraction" min="0" max="64" value="34" /></div>
        <div class="ctl"><label>Rim width <output id="oEdge">30px</output></label>
          <input type="range" id="rEdge" min="6" max="70" value="30" /></div>
        <div class="ctl"><label>Blur <output id="oBlur">2px</output></label>
          <input type="range" id="rBlur" min="0" max="16" value="2" /></div>
        <div class="ctl"><label>Saturation <output id="oSaturate">150%</output></label>
          <input type="range" id="rSaturate" min="60" max="240" value="150" /></div>
        <div class="ctl"><label>Chromatic <output id="oChroma">2.0%</output></label>
          <input type="range" id="rChroma" min="0" max="80" value="20" /></div>
        <div class="ctl"><label>Spring <output id="oSpring">220</output></label>
          <input type="range" id="rSpring" min="70" max="420" value="220" /></div>
      </div>
    </section>

    <!-- dock: five functional, hand-drawn icons -->
    <footer class="dock" data-liquid-glass data-radius="26" id="dock">
      <button class="dock-item" id="dockTheme" data-liquid-glass data-radius="16" title="Toggle theme">
        <span class="tile-bg tg-sunset"></span>
        <svg class="glyph" viewBox="0 0 24 24">
          <g class="glyph-sun">
            <circle cx="12" cy="12" r="4.4" fill="#fff" stroke="none"/>
            <g stroke="#fff" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="3.2" x2="12" y2="5.6"/><line x1="12" y1="18.4" x2="12" y2="20.8"/>
              <line x1="3.2" y1="12" x2="5.6" y2="12"/><line x1="18.4" y1="12" x2="20.8" y2="12"/>
              <line x1="5.8" y1="5.8" x2="7.4" y2="7.4"/><line x1="16.6" y1="16.6" x2="18.2" y2="18.2"/>
              <line x1="18.2" y1="5.8" x2="16.6" y2="7.4"/><line x1="7.4" y1="16.6" x2="5.8" y2="18.2"/>
            </g>
          </g>
          <path class="glyph-moon" d="M20.2 14.8A8.6 8.6 0 1 1 9.2 3.8a7.2 7.2 0 0 0 11 11z"
                fill="#fff" stroke="none"/>
        </svg>
      </button>

      <button class="dock-item" id="dockMotion" data-liquid-glass data-radius="16" title="Pause background motion">
        <span class="tile-bg tg-teal"></span>
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 8.5c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0"/>
          <path d="M3 14.5c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0"/>
          <path d="M5 20c2-2 4-2 6 0"/>
        </svg>
      </button>

      <button class="dock-item" id="dockPreset" data-liquid-glass data-radius="16" title="Cycle material presets">
        <span class="tile-bg tg-violet"></span>
        <svg class="glyph" viewBox="0 0 24 24">
          <path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff" stroke="none"/>
          <circle cx="18.6" cy="5.4" r="1.5" fill="#fff" stroke="none" opacity=".85"/>
        </svg>
      </button>

      <a class="dock-item" id="dockStar" href="https://github.com/Pi-zzy/liquid-glass" target="_blank" rel="noopener"
         data-liquid-glass data-radius="16" title="Star on GitHub">
        <span class="tile-bg tg-charcoal"></span>
        <svg class="glyph" viewBox="0 0 24 24">
          <path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"
                fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </a>

      <button class="dock-item" id="dockFullscreen" data-liquid-glass data-radius="16" title="Toggle fullscreen">
        <span class="tile-bg tg-rose"></span>
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/>
          <path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/>
          <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/>
          <path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
        </svg>
      </button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <div class="badge">Built with 0 dependencies · <a href="https://github.com/Pi-zzy/liquid-glass">Pi-zzy/liquid-glass</a></div>

  <script src="liquid-glass.js"></script>
  <script src="demo.js"></script>
</body>
</html>
